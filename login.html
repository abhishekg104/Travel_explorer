<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Travel Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo"><i class="fas fa-globe"></i><span>Travel Explorer</span></div>
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#destinations">Destinations</a></li>
          <li><a href="index.html#contact">Contact Us</a></li>
          <li><a href="favorites.html" class="favorites-link"><i class="fas fa-heart"></i> Favorites</a></li>
        </ul>
        <button class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon"></i></button>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
    </nav>

    <main class="auth-card">
      <h1>Account</h1>
      <div class="auth-tabs"><button type="button" id="tabLogin" class="on">Log in</button><button type="button" id="tabSignup">Sign up</button></div>
      <form class="booking-form" id="authForm">
        <div class="form-group" id="nameRow" style="display:none"><label>Name</label><input id="authName" /></div>
        <div class="form-group"><label>Email</label><input type="email" id="authEmail" required /></div>
        <div class="form-group"><label>Password</label><input type="password" id="authPw" minlength="6" required /></div>
        <button class="submit-btn" id="authSubmit" type="submit">Log in</button>
        <p class="auth-msg"><a href="#" id="forgot">Forgot password?</a></p>
        <p class="auth-msg" id="authMsg"></p>
      </form>
    </main>
    <footer class="footer"><div class="container"><div class="footer-content"><div class="footer-section"><h3><i class="fas fa-globe"></i> Travel Explorer</h3><p>A small trip-planning project by Abhishek.</p></div></div><div class="footer-bottom"><p>&copy; 2026 Travel Explorer. All rights reserved.</p></div></div></footer>

    <button class="scroll-to-top" id="scrollToTop"><i class="fas fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="api-config.js"></script>
    <script src="common.js"></script>
    <script>
      let mode = 'login';
      const $ = id => document.getElementById(id);
      const raw = new URLSearchParams(location.search).get('next') || 'dashboard.html';
      const next = /^[\w\-.\/?=&%]+$/.test(raw) && !raw.startsWith('//') ? raw : 'dashboard.html';
      const msg = (t, err) => { $('authMsg').textContent = t; $('authMsg').className = 'auth-msg ' + (err ? 'error-message' : 'success-message'); };
      function setMode(m) {
        mode = m;
        $('tabLogin').classList.toggle('on', m === 'login'); $('tabSignup').classList.toggle('on', m === 'signup');
        $('nameRow').style.display = m === 'signup' ? '' : 'none';
        $('authSubmit').textContent = m === 'signup' ? 'Create account' : 'Log in';
        $('authPw').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
      }
      document.addEventListener('DOMContentLoaded', async () => {
        await initCommon();
        if (!sb) return msg('Backend not configured yet. See README.', true);
        if (currentUser) { location.href = next; return; }
        $('tabLogin').onclick = () => setMode('login'); $('tabSignup').onclick = () => setMode('signup');
        if (location.hash === '#signup') setMode('signup');
        $('authForm').onsubmit = async e => {
          e.preventDefault(); msg('Working…');
          const email = $('authEmail').value.trim(), password = $('authPw').value;
          const res = mode === 'signup'
            ? await sb.auth.signUp({ email, password, options: { data: { name: $('authName').value.trim() } } })
            : await sb.auth.signInWithPassword({ email, password });
          if (res.error) return msg(res.error.message, true);
          if (!res.data.session) return msg('Check your email to confirm the account, then log in.');
          location.href = next;
        };
        $('forgot').onclick = async e => {
          e.preventDefault();
          const email = $('authEmail').value.trim();
          if (!email) return msg('Type your email first.', true);
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/dashboard.html' });
          error ? msg(error.message, true) : msg('Reset link sent. Check your email.');
        };
      });
    </script>
  </body>
</html>
